indexpage:
  title: ONTAP Foreign LUN Import Documentation
  lead: Foreign LUN Import (FLI) is an ONTAP capability that enables block level (LUN) data migration by copying user data from a foreign array LUN into an ONTAP LUN. ONTAP performs the migration by acting as a SCSI initiator that reads from the foreign LUN and writes to the destination ONTAP LUN.
